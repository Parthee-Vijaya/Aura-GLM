name: Udgiv downloadside
on:
  workflow_dispatch:
    inputs:
      offentlig_udgivelse:
        description: 'Jeg godkender denne GitHub-kørsel og offentlig udgivelse af hjemmesiden'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.offentlig_udgivelse == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Kontrollér offentlig adgang før bygning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/ai-alliancen-org/ai-harness > "$RUNNER_TEMP/repository.json"
          gh api repos/ai-alliancen-org/ai-harness/pages > "$RUNNER_TEMP/pages.json"
          node scripts/pages-access.cjs "$RUNNER_TEMP/repository.json" "$RUNNER_TEMP/pages.json"
      - name: Hent faktiske udgivelser og byg siden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/ai-alliancen-org/ai-harness/releases?per_page=100' --jq 'add' > "$RUNNER_TEMP/releases.json"
          node scripts/build-pages.cjs "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/repository.json"
      - name: Kontrollér adgang igen før upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/ai-alliancen-org/ai-harness > "$RUNNER_TEMP/repository.json"
          gh api repos/ai-alliancen-org/ai-harness/pages > "$RUNNER_TEMP/pages.json"
          node scripts/pages-access.cjs "$RUNNER_TEMP/repository.json" "$RUNNER_TEMP/pages.json"
      # Downloadpakkernes .gitignore-filer skal med; v4 og nyere udelader ellers filer, der starter med punktum.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .cache/pages
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Kontrollér offentlig adgang før udgivelse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/ai-alliancen-org/ai-harness > "$RUNNER_TEMP/repository.json"
          gh api repos/ai-alliancen-org/ai-harness/pages > "$RUNNER_TEMP/pages.json"
          node scripts/pages-access.cjs "$RUNNER_TEMP/repository.json" "$RUNNER_TEMP/pages.json"
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
