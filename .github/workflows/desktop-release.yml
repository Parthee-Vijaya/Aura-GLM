name: Offentliggør gennemgået desktopbeta
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Eksisterende tag og releasekladde, fx v0.2.0-beta.6'
        type: string
        required: true
      godkend_udgivelse:
        description: 'Jeg godkender denne kørsel og offentliggørelse af de uploadede installationsfiler'
        type: boolean
        default: false
        required: true
      komplai_afproevet:
        description: 'Valgfrit: Komplai-login, modelkald og kreditregnskab er liveafprøvet; kontrollér også loginopsætningen'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.godkend_udgivelse
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ai-alliancen-org/ai-harness
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Kontrollér version og eksisterende tag
        shell: bash
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./desktop/package.json").version) throw Error("Tag matcher ikke appversionen")'
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - name: Hent kun filerne fra den eksisterende kladde
        shell: bash
        run: |
          gh api "repos/$GH_REPO" > "$RUNNER_TEMP/repository.json"
          node scripts/download-desktop-draft.cjs "$RELEASE_TAG" "$RUNNER_TEMP/aura-release" "$RUNNER_TEMP/release.json"
      - name: Kontrollér alle downloads
        run: node scripts/check-release.cjs "$RUNNER_TEMP/aura-release" "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/repository.json"
      - name: Kontrollér Komplais loginopsætning efter den særskilte liveprøve
        if: inputs.komplai_afproevet == true
        run: node -e 'require("./scripts/check-release.cjs").checkKomplaiConfig().catch(error => { console.error(error.message); process.exitCode = 1; })'
      - name: Kontrollér kladden igen og offentliggør den
        shell: bash
        run: |
          RELEASE_ID=$(node -p 'require(process.argv[1]).id' "$RUNNER_TEMP/release.json")
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-current.json"
          node -e 'const fs=require("fs");const {releaseSnapshot}=require("./scripts/release-contract.cjs");const p=process.env.RUNNER_TEMP; if(releaseSnapshot(JSON.parse(fs.readFileSync(p+"/release.json")))!==releaseSnapshot(JSON.parse(fs.readFileSync(p+"/release-current.json")))) throw Error("Kladdeudgivelsen blev ændret under kontrollen")'
          git fetch origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Næste trin
        run: echo 'Betaen er offentliggjort. Pages skal opdateres med en særskilt godkendt manuel kørsel.' >> "$GITHUB_STEP_SUMMARY"
